<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月間人気ランキング | 猫カフェLucie</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <nav class="nav">

            <img class="nav-logo" src="./images/nav-logo.jpg" alt="ナビゲーションロゴ">

            <!-- ハンバーガーメニュー -->
            <div class="hamburger-menu">

                <input type="checkbox" id="menu-btn-check">

                <label for="menu-btn-check" class="menu-btn">
                    <span></span>
                </label>

                <div class="menu-content">
                    <ul class="hamburger-nav-list">

                        <li>
                            <a href="./index.html" class="nav-link">
                                メインページ
                            </a>
                        </li>

                        <li>
                            <a href="./rules.html" class="nav-link">
                                お約束
                            </a>
                        </li>

                    </ul>
                </div>

            </div>

            <!-- 通常メニュー -->
            <div class="normal-menu">

                <ul class="nav-list">

                    <li>
                        <a href="./index.html" class="nav-link">
                            メインページ
                        </a>
                    </li>

                    <li>
                        <a href="./rules.html" class="nav-link">
                            お約束
                        </a>
                    </li>

                </ul>

            </div>

        </nav>

    </header>


    <main>

        <section id="ranking">

            <div class="ranking-content">

                <h1 class="ranking-title">
                    - 月間人気ランキング -
                </h1>

                <div class="ranking-list">


                    <!-- 1位 -->
                    <article class="cat-card cat-card-first">

                        <img
                            class="cat-image"
                            src="./images/ranking-cat1.PNG"
                            alt="ランキング1位のえるくん"
                        >

                        <h2 class="cat-name">
                            えるくん
                        </h2>

                        <p class="cat-information">
                            猫種：ラグドール
                        </p>



                        <p class="cat-information">
                            イケメン度：☆☆☆☆☆
                        </p>

                        <p class="cat-information">
                            おすすめ度：☆☆☆☆☆
                        </p>

                    </article>


                    <!-- 2位 -->
                    <article class="cat-card cat-card-second">

                        <img
                            class="cat-image"
                            src="./images/ranking-cat2.PNG"
                            alt="ランキング2位のれいちゃん"
                        >

                        <h2 class="cat-name">
                            れいちゃん
                        </h2>

                        <p class="cat-information">
                            猫種：スコティッシュ<span class="sp-only"><br></span>フォールド
                        </p>

                        <p class="cat-information">
                            可愛さ：☆☆☆☆☆
                        </p>

                        <p class="cat-information">
                            おすすめ度：☆☆☆☆☆
                        </p>

                    </article>


                    <!-- 3位 -->
                    <article class="cat-card cat-card-third">

                        <img
                            class="cat-image"
                            src="./images/ranking-cat3.PNG"
                            alt="ランキング3位のりんくん"
                        >

                        <h2 class="cat-name">
                            りんくん
                        </h2>

                        <p class="cat-information">
                            猫種：アメリカン<span class="sp-only"><br></span>ショートヘア
                        </p>

                        <p class="cat-information">
                            イケメン度：☆☆☆☆☆
                        </p>

                        <p class="cat-information">
                            おすすめ度：☆☆☆☆☆
                        </p>

                    </article>


                </div>

            </div>

        </section>

    </main>


    <footer id="footer">

        <div class="footer-content">

            <p class="footer-copyright">
                Copyright © Lucie All Rights Reserved.
            </p>

        </div>

    </footer>

</body>

</html>
